<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <title>DSH Remote</title>
  <link rel="stylesheet" href="./settings.css">
  <script type="module" src="./settings.js"></script>
</head>
<body>
  <header><span class="brand">DSH<span class="brand-detail"> / REMOTE</span></span>
    <select id="language" aria-label="Language"><option value="en">English</option><option value="zh">简体中文</option></select>
  </header>
  <main>
    <div class="connection-mark" aria-hidden="true">↗</div>
    <p class="eyebrow" data-text="eyebrow"></p>
    <h1 data-text="heading"></h1>
    <p class="intro" data-text="intro"></p>
    <form id="connection-form">
      <label for="server" data-text="server"></label>
      <input id="server" name="server" type="url" placeholder="https://server.example/" autocomplete="off" spellcheck="false" required aria-describedby="url-hint">
      <p class="hint" id="url-hint" data-text="urlHint"></p>
      <label for="token" data-text="token"></label>
      <input id="token" name="token" type="password" autocomplete="off" spellcheck="false" required aria-describedby="token-hint">
      <p class="hint" id="token-hint" data-text="tokenHint"></p>
      <div id="status" role="status" aria-live="polite"></div>
      <div class="actions"><button id="connect" type="submit" data-text="connect"></button><button id="cancel" type="button" data-text="cancel" hidden></button></div>
    </form>
  </main>
  <footer data-text="footer"></footer>
</body>
</html>
