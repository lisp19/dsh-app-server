name: Publish versioned release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require a version tag and release notes
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, access } from 'node:fs/promises';
          const { version } = JSON.parse(await readFile('package.json', 'utf8'));
          assert.equal(process.env.RELEASE_REF, `refs/tags/v${version}`, 'Run releases from the current version tag');
          await access(`docs/releases/v${version}.md`);
          NODE
  build:
    needs: validate
    uses: ./.github/workflows/verify.yml
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
          digest-mismatch: error
      - name: Validate complete release set and hashes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-assets.mjs release-assets "$RELEASE_TAG"
      - name: Publish immutable version assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "DSH App Server $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
