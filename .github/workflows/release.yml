name: Publish versioned release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_only:
        description: Build and publish without running tests (document this in release notes)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/verify.yml
    with:
      build_only: ${{ inputs.build_only == true }}
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Validate complete release set and hashes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-assets.mjs release-assets "$RELEASE_TAG"
      - name: Publish immutable version assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "DSH App Server $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
